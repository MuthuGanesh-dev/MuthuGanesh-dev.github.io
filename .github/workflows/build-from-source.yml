name: Build from source repo and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  SOURCE_REPO: Nithishuchiha/Muthu_ganesh_animated_portfolio
  SOURCE_REF: main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/vite-project/package-lock.json

      - name: Install dependencies
        working-directory: source/vite-project
        run: npm ci

      - name: Build
        working-directory: source/vite-project
        run: npm run build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: source/vite-project/dist
          publish_branch: gh-pages
          force_orphan: true
